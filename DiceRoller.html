<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Static Dice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap');

        :root {
            --bg-deep: #020617;
            --bg-card: rgba(0, 212, 255, 0.05); /* Lighter Azure tint */
            --accent-azure: #00d4ff;
            --accent-glow: rgba(0, 212, 255, 0.5);
            --accent-violet: #6366f1;
            --accent-plasma: #1e3a8a;
            --text-pale: #e2e8f0;
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shine: rgba(255, 255, 255, 0.03);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-deep);
            background-image:
                radial-gradient(circle at 0% 0%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(0, 212, 255, 0.08) 0%, transparent 40%);
            color: var(--text-pale);
            min-height: 100vh;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .hide-spinners::-webkit-outer-spin-button,
        .hide-spinners::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .hide-spinners {
            -moz-appearance: textfield;
        }

        .glass-panel {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .segmented-row {
            background: rgba(15, 23, 42, 0.4); /* Deeper glass base */
            border: 1px solid rgba(0, 212, 255, 0.15); /* Sharp Azure glass edge */
            border-radius: 0.8rem;
            display: flex;
            align-items: stretch;
            height: 3rem;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: inset 0 0 12px rgba(0, 212, 255, 0.03);
        }

        .segmented-row:hover {
            border-color: rgba(0, 212, 255, 0.45); /* Sharper Azure edge */
            background: rgba(15, 23, 42, 0.6);
            box-shadow: 
                0 0 20px rgba(0, 212, 255, 0.12),
                inset 0 0 15px rgba(0, 212, 255, 0.05);
        }

        .segmented-row:focus-within:not(.toggle-btn) {
            border-color: rgba(0, 212, 255, 0.4);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
        }

        .segmented-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            position: relative;
        }

        .segmented-btn:active:not(:disabled) {
            background: #00d4ff !important;
            color: #020617 !important;
            transform: scale(0.96);
            box-shadow: 0 0 35px #00d4ff;
            z-index: 50;
            position: relative;
        }

        button:focus, button:active {
            outline: none !important;
            -webkit-tap-highlight-color: transparent;
        }

        .segmented-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-side {
            width: 20%;
            flex-shrink: 0;
            font-size: 1.25rem;
            font-weight: 600;
            color: #94a3b8;
        }

        .btn-center {
            flex-grow: 1;
            border-left: 1px solid rgba(0, 212, 255, 0.1);
            border-right: 1px solid rgba(0, 212, 255, 0.1);
            background: rgba(255, 255, 255, 0.02);
            overflow: hidden;
        }

        .btn-center svg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.08;
            width: 2.5rem;
            height: 2.5rem;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .segmented-row:hover .btn-center svg {
            opacity: 0.25;
            transform: translate(-50%, -50%) scale(1.2);
            filter: drop-shadow(0 0 10px rgba(0, 212, 255, 0.4));
        }

        .segmented-row:hover .btn-center span {
            color: #00d4ff;
            text-shadow: 0 0 12px rgba(0, 212, 255, 0.6);
        }

        .btn-side:hover {
            color: #00d4ff;
            background: rgba(0, 212, 255, 0.05);
        }

        @keyframes pulse-emerald {
            0% {
                filter: drop-shadow(0 0 0px var(--accent-azure));
                transform: scale(1);
            }

            50% {
                filter: drop-shadow(0 0 30px var(--accent-azure));
                transform: scale(1.15);
                opacity: 1;
            }
            100% {
                filter: drop-shadow(0 0 10px var(--accent-azure));
                transform: scale(1);
            }
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) rotate(0deg); }
            100% { transform: translateX(100%) rotate(0deg); }
        }

        .crit-hit {
            animation: pulse-emerald 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: var(--accent-azure) !important;
            text-shadow: 0 0 25px var(--accent-azure);
        }

        .crit-fail {
            color: var(--accent-rose) !important;
            opacity: 0.8;
            transform: scale(0.9) rotate(-3deg);
            text-shadow: 0 0 20px var(--accent-rose);
            transition: all 0.3s ease;
        }

        @keyframes roll-blur {
            0% {
                filter: blur(0) brightness(1);
                transform: translateY(0);
            }

            50% {
                filter: blur(6px) brightness(1.2);
                transform: translateY(-4px);
            }

            100% {
                filter: blur(0) brightness(1);
                transform: translateY(0);
            }
        }

        .is-rolling {
            animation: roll-blur 0.1s infinite;
        }

        .bar {
            background: var(--accent-azure);
            border-radius: 2px;
            transition: height 0.3s ease;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .saved-item {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(0, 212, 255, 0.25);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            height: 3.5rem;
            box-shadow: inset 0 0 10px rgba(0, 212, 255, 0.05);
        }

        .saved-item:hover {
            background: rgba(0, 212, 255, 0.08);
            border-color: rgba(0, 212, 255, 0.5);
            transform: translateY(-1.5px);
            box-shadow: 
                0 0 20px rgba(0, 212, 255, 0.15),
                inset 0 0 15px rgba(0, 212, 255, 0.05);
        }

        .saved-item:active {
            transform: scale(0.97);
            box-shadow: 0 0 40px var(--item-color, #00d4ff);
            background: var(--item-color, #00d4ff) !important;
        }

        .saved-item:active * {
            color: #020617 !important;
        }

        #color-picker-overlay {
            background: rgba(2, 6, 23, 0.85);
            backdrop-filter: blur(16px);
            z-index: 100;
        }

        /* Arsenal Action Menu */
        .arsenal-menu {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 1.25rem;
            box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.6);
            z-index: 100;
            min-width: 160px;
            padding: 0.6rem;
            transform-origin: top right;
            animation: menu-pop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes menu-pop {
            from {
                transform: scale(0.9) translateY(-10px);
                opacity: 0;
            }

            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.6rem 0.8rem;
            border-radius: 0.75rem;
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
            transition: all 0.2s ease;
            width: 100%;
            text-align: left;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #f8fafc;
        }

        .menu-item.danger:hover {
            background: rgba(244, 63, 94, 0.1);
            color: #fb7185;
        }

        .menu-item svg {
            opacity: 0.6;
            transition: opacity 0.2s ease;
        }

        .menu-item:hover svg {
            opacity: 1;
        }

        .result-shimmer {
            position: relative;
            overflow: hidden;
        }

        .result-shimmer::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            transform: rotate(45deg);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%) rotate(45deg);
            }

            100% {
                transform: translateX(100%) rotate(45deg);
            }
        }

        .desktop-only {
            display: none;
        }

        @media (min-width: 640px) {
            .mobile-only {
                display: none !important;
            }

            .desktop-only {
                display: block !important;
            }
        }

        /* Mode Toggle Styles */
        .mode-dice .section-dice {
            order: 2;
        }

        .mode-dice .section-arsenal {
            order: 3;
        }

        .mode-arsenal .section-dice {
            order: 3;
        }

        .mode-arsenal .section-arsenal {
            order: 2;
        }

        .section-sticky {
            order: 0;
        }

        .section-controls {
            order: 1;
        }

        .section-bottom {
            order: 10;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 20px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(30, 41, 59, 0.5);
            transition: .4s;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 12px;
            width: 12px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.toggle-slider {
            background-color: var(--accent-azure);
        }

        input:checked+.toggle-slider:before {
            transform: translateX(16px);
        }

        .volume-slider-overlay {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            padding: 8px 16px;
            border-radius: 1rem;
            z-index: 100;
            display: none;
            flex-direction: row;
            align-items: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            width: 180px;
            height: 40px;
        }

        .volume-slider-overlay.show {
            display: flex;
        }

        .horizontal-range {
            flex-grow: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            outline: none;
            appearance: none;
            margin: 0;
            width: 100%;
        }

        .horizontal-range::-webkit-slider-thumb {
            appearance: none;
            width: 14px;
            height: 14px;
            background: var(--accent-sky);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .set-match {
            color: #fff;
            text-shadow: 0 0 10px var(--accent-sky);
            background: rgba(56, 189, 248, 0.15);
            padding: 0 2px;
            border-radius: 4px;
            font-weight: 800;
        }

        .set-dim {
            opacity: 0.4;
        }

        .result-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 9999px;
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: 1px solid;
            backdrop-filter: blur(4px);
        }

        .result-badge.badge-sky {
            background: rgba(0, 212, 255, 0.1);
            border-color: rgba(0, 212, 255, 0.25);
            color: #00d4ff;
        }

        .result-badge.badge-emerald {
            background: rgba(0, 212, 255, 0.15);
            border-color: rgba(0, 212, 255, 0.3);
            color: #00d4ff;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.2);
        }

        .result-badge.badge-rose {
            background: rgba(99, 102, 241, 0.1);
            border-color: rgba(99, 102, 241, 0.25);
            color: #a5b4fc;
        }

        .result-badge.badge-amber {
            background: rgba(6, 182, 212, 0.1);
            border-color: rgba(6, 182, 212, 0.25);
            color: #06b6d4;
        }

        .result-badge.badge-slate {
            background: rgba(148, 163, 184, 0.08);
            border-color: rgba(148, 163, 184, 0.2);
            color: #94a3b8;
        }

        .breakdown-row {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: baseline;
            width: 100%;
            padding: 2px 0;
            font-size: 10px;
            line-height: 1.4;
        }

        .breakdown-formula {
            color: #38bdf8;
            font-weight: 700;
            white-space: nowrap;
            text-align: left;
        }

        .breakdown-rolls {
            color: #cbd5e1;
            white-space: nowrap;
            text-align: center;
            padding: 0 10px;
        }

        .breakdown-subtotal {
            color: #fff;
            font-weight: 800;
            white-space: nowrap;
            text-align: right;
        }

        .label-emerald {
            color: #00d4ff;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
        }

        .label-rose {
            color: #6366f1;
            text-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        }

        .label-sky {
            color: #3b82f6;
            text-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }

        .label-slate {
            color: #e2e8f0;
            text-shadow: 0 0 20px rgba(226, 232, 240, 0.2);
        }

        .label-white {
            color: #f8fafc;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .plasma-highlight {
            background: rgba(0, 212, 255, 0.15) !important;
            color: #00d4ff !important;
            border-color: rgba(0, 212, 255, 0.4) !important;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }
    </style>
</head>

<body class="flex flex-col items-center">
    <div id="main-container" class="w-full max-w-md p-4 space-y-3 flex flex-col min-h-screen mode-dice">

        <!-- STICKY TOP -->
        <div
            class="section-sticky sticky top-0 z-40 bg-[#020617]/80 backdrop-blur-md -mx-4 px-4 py-3 space-y-4 shadow-xl border-b border-white/5">
            <input type="file" id="import-input" class="hidden" accept=".json" onchange="importSettings(event)">
            <!-- HEADER -->
            <header class="flex justify-between items-center px-2">
                <div class="flex flex-col">
                    <h1 class="text-xl font-black text-[#e2e8f0] tracking-tighter leading-none">STATIC<span
                            class="text-[#00d4ff]">DICE</span></h1>
                    <span
                        class="text-[8px] font-bold uppercase tracking-[0.15em] leading-none mt-1 bg-gradient-to-r from-slate-400 to-slate-600 bg-clip-text text-transparent"
                        style="-webkit-background-clip: text; -webkit-text-fill-color: transparent;">Harnessing raw
                        electrical entropy</span>
                </div>
                <div class="flex items-center gap-1.5 sm:gap-3">
                    <!-- SETTINGS CONTROLS -->
                    <div class="flex items-center gap-1.5">
                        <button onclick="document.getElementById('import-input').click()"
                            class="bg-[#00d4ff]/10 text-[#94a3b8] h-8 w-8 flex items-center justify-center rounded-lg border border-[#00d4ff]/10 transition-all hover:text-[#00d4ff] active:scale-95"
                            title="Import Settings & Loadouts">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                            </svg>
                        </button>
                        <button onclick="exportSettings()"
                            class="bg-[#00d4ff]/10 text-[#94a3b8] h-8 w-8 flex items-center justify-center rounded-lg border border-[#00d4ff]/10 transition-all hover:text-[#00d4ff] active:scale-95"
                            title="Export Settings & Loadouts">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                            </svg>
                        </button>
                    </div>

                    <div class="w-px h-6 bg-white/10 hidden sm:block"></div>

                    <!-- SOUND CONTROL -->
                    <div class="flex items-center relative">
                        <button id="sound-btn" onclick="toggleSound()" onmousedown="handleSoundStart(event)"
                            onmouseup="handleSoundEnd(event)" onmouseleave="handleSoundEnd(event)"
                            ontouchstart="handleSoundStart(event)" ontouchend="handleSoundEnd(event)"
                            class="bg-[#00d4ff]/10 text-[#94a3b8] h-8 w-8 flex items-center justify-center rounded-lg border border-[#00d4ff]/10 transition-all hover:text-[#00d4ff] active:scale-95">
                            <svg id="sound-icon-on" class="w-4 h-4" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                            </svg>
                            <svg id="sound-icon-off" class="w-4 h-4 hidden" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
                            </svg>
                        </button>
                        <div id="volume-overlay" class="volume-overlay volume-slider-overlay">
                            <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.5"
                                class="horizontal-range" oninput="updateVolume(this.value)">
                        </div>
                    </div>
                </div>
            </header>

            <!-- MAIN DISPLAY -->
            <main
                class="glass-panel p-4 rounded-2xl flex flex-col items-center justify-center min-h-[90px] relative overflow-hidden shrink-0 result-shimmer">
                <div
                    class="absolute inset-0 bg-gradient-to-br from-sky-500/5 via-transparent to-rose-500/5 pointer-events-none">
                </div>
                <div id="result-hero"
                    class="final-result-val text-5xl font-black text-[#e2e8f0] leading-none tabular-nums tracking-tighter transition-all duration-300 drop-shadow-2xl">
                    0</div>
                <div id="result-label"
                    class="text-sm font-black uppercase tracking-widest mt-1 transition-all duration-300 hidden"></div>
                <div id="result-badges" class="flex flex-wrap gap-1.5 justify-center mt-2 hidden"></div>
                <div id="result-breakdown"
                    class="detail-text-val w-full mt-3 mono text-center px-2 min-h-[16px] opacity-90">
                    <span class="text-[11px] text-slate-300 tracking-wide">READY</span>
                </div>
            </main>
        </div>

        <!-- CONTROLS -->
        <section class="section-controls space-y-3">
            <!-- ROLL BUTTON -->
            <button id="roll-button" onclick="resolveRolling()"
                class="w-full bg-[#00d4ff]/10 hover:bg-[#00d4ff]/20 text-[#00d4ff] hover:text-[#33e0ff] font-black py-4 rounded-xl text-2xl shadow-[0_0_25px_rgba(0,212,255,0.15)] active:scale-[0.95] active:shadow-[0_0_60px_#00d4ff] active:bg-[#00d4ff] active:text-[#020617] active:z-50 transition-all border border-[#00d4ff]/30 hover:border-[#00d4ff]/50 uppercase tracking-[0.2em] mb-4 relative overflow-hidden group">
                <span class="relative z-10">ROLL</span>
                <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/10 to-transparent -translate-x-full group-hover:animate-[shimmer_1.5s_infinite]"></div>
            </button>

            <div class="flex gap-2">
                <div
                    class="flex-1 glass-panel px-4 py-2 rounded-xl flex items-center justify-center min-h-[40px] border-white/5 overflow-hidden">
                    <div id="queue-display"
                        class="text-[12px] font-bold text-sky-400 mono text-center leading-relaxed uppercase truncate">
                        EMPTY</div>
                </div>
                <div class="flex gap-1.5">
                    <button onclick="backspaceQueue()"
                        class="bg-[#00d4ff]/05 text-[#94a3b8] px-2.5 py-1.5 rounded-lg border border-[#00d4ff]/10 font-black text-[9px] active:bg-[#00d4ff]/20 transition-all uppercase hover:text-[#00d4ff]">
                        ⌫
                    </button>
                    <button id="clear-btn" onclick="clearQueue()"
                        class="bg-[#00d4ff]/10 text-[#00d4ff] px-3 py-1.5 rounded-lg border border-[#00d4ff]/40 font-black text-[9px] active:bg-[#00d4ff] active:text-[#020617] active:shadow-[0_0_25px_#00d4ff] transition-all uppercase hover:bg-[#00d4ff]/20 hover:border-[#00d4ff]/60 tracking-wider">

        function showModal({ title, body, confirmText = 'OK', cancelText = 'Cancel', danger = false, alertOnly = false, inputPrompt = false, defaultValue = '' }) {
            return new Promise(resolve => {
                const overlay = document.getElementById('modal-overlay');
                const box = document.getElementById('modal-box');
                const titleEl = document.getElementById('modal-title');
                const bodyEl = document.getElementById('modal-body');
                const btnsEl = document.getElementById('modal-buttons');

                titleEl.innerHTML = title;
                let bodyHtml = body || '';
                if (inputPrompt) {
                    bodyHtml += `<input type="text" id="modal-input" value="${defaultValue.replace(/"/g, '&quot;')}" class="w-full mt-3 bg-slate-800 border border-white/10 rounded-xl px-3 py-2 text-sm text-[#e2e8f0] font-bold text-center outline-none focus:border-sky-500 transition-colors" autocomplete="off">`;
                }
                bodyEl.innerHTML = bodyHtml;
                bodyEl.style.display = (body || inputPrompt) ? '' : 'none';
                box.style.borderColor = danger ? 'rgba(244, 63, 94, 0.3)' : 'rgba(56, 189, 248, 0.2)';

                let btns = '';
                if (alertOnly) {
                    btns = `<button id="modal-ok-btn" class="flex-1 py-2 rounded-xl border border-sky-500/30 text-sky-400 font-bold text-xs hover:bg-sky-500 hover:text-[#e2e8f0] transition-colors">OK</button>`;
                } else {
                    const confirmClass = danger
                        ? 'bg-rose-500/20 border border-rose-500/50 text-rose-400 hover:bg-rose-500 hover:text-[#e2e8f0]'
                        : 'bg-sky-500/20 border border-sky-500/50 text-sky-400 hover:bg-sky-500 hover:text-[#e2e8f0]';
                    btns = `
                        <button id="modal-cancel-btn" class="flex-1 py-2 rounded-xl border border-white/10 text-[#94a3b8] font-bold text-xs hover:bg-white/5 transition-colors">${cancelText}</button>
                        <button id="modal-confirm-btn" class="flex-1 py-2 rounded-xl ${confirmClass} font-bold text-xs transition-colors">${confirmText}</button>
                    `;
                }
                btnsEl.innerHTML = btns;

                const getResult = (confirmed) => {
                    overlay.classList.add('hidden');
                    overlay.classList.remove('flex');
                    if (inputPrompt) {
                        const inputEl = document.getElementById('modal-input');
                        resolve(confirmed ? (inputEl ? inputEl.value : null) : null);
                    } else {
                        resolve(confirmed);
                    }
                };
                modalResolve = (val) => getResult(val);

                if (alertOnly) {
                    document.getElementById('modal-ok-btn').onclick = () => getResult(true);
                } else {
                    document.getElementById('modal-cancel-btn').onclick = () => getResult(false);
                    document.getElementById('modal-confirm-btn').onclick = () => getResult(true);
                }

                overlay.classList.remove('hidden');
                overlay.classList.add('flex');

                if (inputPrompt) {
                    setTimeout(() => {
                        const inputEl = document.getElementById('modal-input');
                        if (inputEl) { inputEl.focus(); inputEl.select(); }
                    }, 50);
                }
            });
        }

        function addCustomDice() {
            showModal({
                title: 'Create Custom Dice',
                body: 'Enter the number of sides:',
                confirmText: 'Create',
                inputPrompt: true,
                defaultValue: ''
            }).then(val => {
                if (!val) return;
                const trimmed = val.trim();
                if (!/^\d+$/.test(trimmed)) {
                    showModal({ title: 'Invalid Input', body: 'Please enter a positive whole number only (no letters or symbols).', alertOnly: true, danger: true });
                    return;
                }
                const num = parseInt(trimmed, 10);
                if (num <= 0) {
                    showModal({ title: 'Invalid Input', body: 'Number of sides must be greater than zero.', alertOnly: true, danger: true });
                    return;
                }

                if (defaultDice.some(d => d.d === num) || customDice.some(d => d.d === num)) {
                    showModal({ title: 'Already Exists', body: 'A dice with that number of sides already exists.', alertOnly: true });
                    return;
                }
                customDice.push({ d: num });
                customDice.sort((a, b) => a.d - b.d);
                saveSettings();
                renderDiceGrid();
            });
        }

        function toggleDeleteMode(e) {
            if (e) e.stopPropagation();
            if (customDice.length === 0) {
                showModal({ title: 'No Custom Dice', body: 'There are no custom dice to delete.', alertOnly: true });
                return;

            deleteMode = !deleteMode;
            renderDiceGrid();

        function closeDeleteModeListener(e) {

                renderDiceGrid();
                document.removeEventListener('click', closeDeleteModeListener);
            }
        }

        function promptDeleteCustomDice(sides, e) {
            if (e) e.stopPropagation();
            pendingDeleteSides = sides;
            showModal({
                title: `Delete <span class="text-rose-400">D${sides}</span>?`,
                body: 'This action cannot be undone.',
                confirmText: 'Delete',
                danger: true
            }).then(confirmed => {
                if (confirmed) {
                    const idx = customDice.findIndex(d => d.d === pendingDeleteSides);
                    if (idx > -1) {
                        customDice.splice(idx, 1);
                        saveSettings();
                    }
                }
                pendingDeleteSides = null;
                deleteMode = false;
                renderDiceGrid();
                document.removeEventListener('click', closeDeleteModeListener);
            });
        }

        function updateRulesUI(fromInput = false) {
            ['reroll', 'explode', 'sets'].forEach(type => {

                if (!opEl) return;
                const op = opEl.value;

                const input = document.getElementById(`rule-${type}-val`);

                if (op) {
                    if (container) container.classList.remove('opacity-30', 'pointer-events-none');
                    if (input && !fromInput && !input.value) input.value = '0';

            // Count threshold: gate the val select based on whether op is set

        function handleSoundStart(e) {
            soundTimer = setTimeout(() => {
                isVolumeOpen = true;
                isDraggingVolume = true;
                showVolumeSlider();

                window.addEventListener('mousemove', handleGlobalDrag);
                window.addEventListener('touchmove', handleGlobalDrag, { passive: false });
                window.addEventListener('mouseup', handleGlobalUp);
                window.addEventListener('touchend', handleGlobalUp);
            }, 500);
        }

        function handleSoundEnd(e) {
            clearTimeout(soundTimer);
        }

        function handleGlobalDrag(e) {
            if (!isDraggingVolume) return;
            e.preventDefault();

            const slider = document.getElementById('volume-slider');
            const rect = slider.getBoundingClientRect();
            const clientX = e.type.startsWith('touch') ? e.touches[0].clientX : e.clientX;

            let percentage = (clientX - rect.left) / rect.width;
            percentage = Math.max(0, Math.min(1, percentage));

            slider.value = percentage;
            updateVolume(percentage);
        }

        function handleGlobalUp() {
            isDraggingVolume = false;
            window.removeEventListener('mousemove', handleGlobalDrag);
            window.removeEventListener('touchmove', handleGlobalDrag);
            window.removeEventListener('mouseup', handleGlobalUp);
            window.removeEventListener('touchend', handleGlobalUp);
        }

        function updateUI() {
            const display = document.getElementById('queue-display');
            const advBtn = document.getElementById('adv-btn');
            const disBtn = document.getElementById('dis-btn');
            const advSub = document.getElementById('adv-sub');
            const disSub = document.getElementById('dis-sub');
            const saveBtn = document.getElementById('save-queue-btn');
            const modInput = document.getElementById('flat-mod-input');

            let parts = engine.rollingQueue.map(q => `${q.count}d${q.sides}`);
            if (engine.flatMod !== 0) parts.push(`[${engine.flatMod > 0 ? '+' : ''}${engine.flatMod}]`);

            let modifierText = engine.activeModifier ? ` [${engine.activeModifier}${engine.modifierLevel > 1 ? '+' + (engine.modifierLevel - 1) : ''}]` : "";

            let rulesText = "";
            const rrActive = engine.rollRules.rerollOp && engine.rollRules.rerollVal !== null;
            const exActive = engine.rollRules.explodeOp && engine.rollRules.explodeVal !== null;
            const setsActive = engine.rollRules.setsOp && engine.rollRules.setsVal !== null;

            if (rrActive) rulesText += ` RR${engine.rollRules.rerollOp}${engine.rollRules.rerollVal}`;
            if (exActive) rulesText += ` EX${engine.rollRules.explodeOp}${engine.rollRules.explodeVal}`;
            if (setsActive) rulesText += ` SET${engine.rollRules.setsOp}${engine.rollRules.setsVal}`;

            const hasBaseContent = parts.length > 0 || modifierText !== "" || engine.overallTarget !== null;
            const hasRules = rrActive || exActive || setsActive;

            if (hasBaseContent || hasRules) {
                if (engine.rollRules.targetMode === 'count') {
                    rulesText += ` CT`;
                    if (engine.rollRules.targetOp && engine.rollRules.targetVal !== null) {
                        rulesText += `${engine.rollRules.targetOp}${engine.rollRules.targetVal}`;
                    }
                } else if (engine.rollRules.targetMode === 'list') {
                    rulesText += ` LIST`;
                } else {
                    rulesText += ` SUM`;
                }
            }

            if (engine.overallTarget !== null) {
                const isCountAny = engine.rollRules.targetMode === 'count' && !engine.rollRules.countThreshOp;
                const isSumAny = engine.rollRules.targetMode === 'sum' && !engine.rollRules.targetOp;
                if (!isCountAny && !isSumAny) {
                    rulesText += ` TARGET≥${engine.overallTarget}`;
                }
            }

            display.innerText = (hasBaseContent || hasRules) ? parts.join(" + ") + modifierText + rulesText : "EMPTY QUEUE";

            if (modInput && document.activeElement !== modInput) {
                modInput.value = engine.flatMod > 0 ? `+${engine.flatMod}` : engine.flatMod;
            }

        function exportSettings() {
            const exportData = {
                queues: engine.savedQueues,
                settings: {
                    soundEnabled: soundEnabled,
                    volume: volume,
                    instaQueue: isInstaQueue,
                    moddedQuick: isModdedQuick,
                    customDice: customDice
                }
            };

            const dataStr = JSON.stringify(exportData, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);

            const link = document.createElement('a');
            link.href = url;
            link.download = `StaticDice_backup_${new Date().toISOString().slice(0, 10)}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        function importSettings(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    let importedQueues = [];
                    let importedSettings = null;

                    if (Array.isArray(imported)) {
                        importedQueues = imported;
                    } else if (imported && typeof imported === 'object') {
                        importedQueues = imported.queues || [];
                        importedSettings = imported.settings;
                    } else {
                        throw new Error("Invalid format");
                    }

                    showModal({
                        title: 'Import Settings',
                        body: 'Choose how to handle your loadouts.',
                        confirmText: 'Merge',
                        cancelText: 'Overwrite'
                    }).then(mergeChosen => {
                        const mode = mergeChosen ? 'merge' : 'overwrite';

                        if (mode === 'merge') {
                            const currentIds = new Set(engine.savedQueues.map(q => q.id));
                            importedQueues.forEach(item => {
                                if (!currentIds.has(item.id)) {
                                    engine.savedQueues.push(item);
                                } else {
                                    item.id = Date.now() + Math.random();
                                    engine.savedQueues.push(item);
                                }
                            });
                        } else {
                            engine.setSavedQueues(importedQueues);
                        }

                        if (importedSettings) {
                            if (importedSettings.soundEnabled !== undefined) {
                                soundEnabled = importedSettings.soundEnabled;
                            }
                            if (importedSettings.volume !== undefined) {
                                volume = importedSettings.volume;
                                rollSound.volume = volume;
                                document.getElementById('volume-slider').value = volume;
                            }
                            if (importedSettings.instaQueue !== undefined) {
                                isInstaQueue = importedSettings.instaQueue;
                            }
                            if (importedSettings.moddedQuick !== undefined) {
                                isModdedQuick = importedSettings.moddedQuick;
                            }
                            if (importedSettings.customDice !== undefined) {
                                customDice = importedSettings.customDice;
                            }
                            if (importedSettings.currentTargetMode !== undefined) {
                                currentTargetMode = importedSettings.currentTargetMode;
                            }
                            renderDiceGrid();
                            saveSettings();
                            updateSoundUI();
                        }

                        persistSaved();
                        renderSavedQueues();
                        showModal({ title: 'Import Complete', body: 'Settings and loadouts successfully imported!', alertOnly: true });
                    });
                } catch (err) {
                    showModal({ title: 'Import Error', body: "Please ensure it's a valid StaticDice settings backup.", alertOnly: true, danger: true });
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        function instantRoll(sides) {
            vibrate(10);

            if (isInstaQueue) {
                engine.changeQueue(sides, 1);
                updateUI();
                resolveRolling();
            } else {
                resolveRolling([{ sides: sides, count: 1 }], !isModdedQuick);
            }
        }

        let rollGeneration = 0;

        function resolveRolling(forcedQueue = null, isInstant = false) {
            if (!forcedQueue && engine.rollingQueue.length === 0 && engine.flatMod === 0) return;

            // Increment generation to cancel any in-progress animation
            const thisGen = ++rollGeneration;

            vibrate(15);
            playRollSound();

            // Compute result immediately (synchronous)
            const res = engine.calculateRoll(forcedQueue, isInstant);
            if (!res) return;

            // Log to history immediately
            let historyText = res.flatDescription;
            if (res.targetMode === 'count') historyText = `${res.total} Dice | ${historyText}`;
            addToHistory(res.total, historyText);

            // Start cosmetic animation, then reveal result
            updateDisplay("...", "rolling");

            let frame = 0;
            const totalFrames = 8;
            const frameDelay = 40;

            function animateFrame() {
                // If a newer roll has started, stop this animation
                if (rollGeneration !== thisGen) return;

                if (frame < totalFrames) {
                    updateDisplay(Math.floor(Math.random() * 20) + 1);
                    frame++;
                    setTimeout(animateFrame, frameDelay);
                } else {
                    // Animation done — show the real result
                    showResult(res);
                }
            }

            setTimeout(animateFrame, frameDelay);
        }

        function showResult(res) {
            const hero = document.getElementById('result-hero');
            const label = document.getElementById('result-label');
            const badges = document.getElementById('result-badges');
            const breakdown = document.getElementById('result-breakdown');

            // HERO zone
            hero.classList.remove('is-rolling');
            hero.className = hero.className.split(' ').filter(c => !c.startsWith('crit-')).join(' ');
            hero.innerText = res.total;
            if (res.heroClass) {
                hero.classList.add(res.heroClass);
                if (res.heroClass === 'crit-hit') vibrate([40, 80, 40]);
                else if (res.heroClass === 'crit-fail') vibrate(60);
                else vibrate(25);
            } else {
                vibrate(25);
            }

            // LABEL zone
            if (res.labels && res.labels.length > 0) {
                label.innerHTML = res.labels.map(l =>
                    `<div class="label-${l.color}">${l.text}</div>`
                ).join('');
                label.className = `text-[11px] font-black uppercase tracking-widest mt-1 space-y-1 transition-all duration-300 flex flex-col items-center`;
                label.classList.remove('hidden');
            } else {
                label.classList.add('hidden');
                label.innerHTML = '';
            }

            // BADGES zone
            if (res.badges && res.badges.length > 0) {
                badges.innerHTML = res.badges.map(b =>
                    `<span class="result-badge badge-${b.color}">${b.icon} ${b.text}</span>`
                ).join('');
                badges.classList.remove('hidden');
            } else {
                badges.classList.add('hidden');
                badges.innerHTML = '';
            }

            // BREAKDOWN zone
            if (res.breakdown && res.breakdown.length > 0) {
                breakdown.innerHTML = res.breakdown.map(row => {
                    if (!row.rolls) {
                        // Flat mod row
                        return `<div class="breakdown-row">
                            <span class="breakdown-formula">${row.formula}</span>
                            <span class="breakdown-rolls text-slate-500">→</span>
                            <span class="breakdown-subtotal">${row.subtotal}</span>
                        </div>`;
                    }
                    return `<div class="breakdown-row">
                        <span class="breakdown-formula">${row.formula}</span>
                        <span class="breakdown-rolls">[${row.rolls}]</span>
                        <span class="breakdown-subtotal"><span class="text-slate-500 mr-1">→</span>${row.subtotal}</span>
                    </div>`;
                }).join('');
            } else {
                breakdown.innerHTML = '';
            }
        }

        function addToHistory(val, desc) {
            const log = document.getElementById('history-log');
            if (log.innerHTML.includes('No history')) log.innerHTML = '';
            const item = document.createElement('div');
            item.className = 'history-item flex items-center justify-between bg-slate-800/10 p-1.5 rounded-lg border border-slate-800/40';
            item.innerHTML = `<span class="text-[8px] text-slate-500 mono truncate">${desc}</span><span class="font-black text-sky-400 mono text-[10px]">${val}</span>`;
            log.prepend(item);
            if (log.children.length > 20) log.removeChild(log.lastChild);
        }

        function clearHistory() {
            document.getElementById('history-log').innerHTML = '<p class="text-[9px] text-slate-700 italic px-1">No history yet...</p>';
        }

        function runCustomStressTest() {
            const iterations = stressCount;
            const sides = 20;
            const tallies = new Array(sides).fill(0);
            const chartArea = document.getElementById('chart-area');
            if (!chartArea) return;
            chartArea.innerHTML = '';
            for (let i = 0; i < iterations; i++) tallies[engine.rng(sides) - 1]++;
            const max = Math.max(...tallies);
            tallies.forEach((t, i) => {
                const bar = document.createElement('div');
                bar.className = 'bar flex-1';
                bar.style.height = `${(t / max) * 100}%`;
                chartArea.appendChild(bar);
            });
        }

        function adjustStressCount(factor) {
            stressCount = Math.min(1000000000, Math.max(1, Math.round(stressCount * factor)));
            updateStressUI();
            vibrate(5);
        }

        function updateStressUI() {
            const display = document.getElementById('stress-count-display');
            if (display) display.innerText = stressCount.toLocaleString();
            const label = document.getElementById('stress-label');
            if (label) label.innerText = `D20 Distribution (N=${stressCount.toLocaleString()})`;
        }

        window.onload = () => {
            const stored = localStorage.getItem('crypto_roller_saved');
            if (stored) {
                engine.setSavedQueues(JSON.parse(stored));
                renderSavedQueues();
            }

            const savedSettingsStr = localStorage.getItem('crypto_roller_settings');
            if (savedSettingsStr) {
                try {
                    const savedSettings = JSON.parse(savedSettingsStr);
                    if (savedSettings.soundEnabled !== undefined) soundEnabled = savedSettings.soundEnabled;
                    if (savedSettings.volume !== undefined) {
                        volume = savedSettings.volume;
                        rollSound.volume = volume;
                        document.getElementById('volume-slider').value = volume;
                    }
                    if (savedSettings.instaQueue !== undefined) {
                        isInstaQueue = savedSettings.instaQueue;
                    }
                    if (savedSettings.moddedQuick !== undefined) {
                        isModdedQuick = savedSettings.moddedQuick;
                    }
                    if (savedSettings.customDice !== undefined) {
                        customDice = savedSettings.customDice;
                    }
                    if (savedSettings.currentTargetMode !== undefined) {
                        currentTargetMode = savedSettings.currentTargetMode;
                    }
                    updateUI();
                    updateSoundUI();
                } catch (e) { }
            }

            // Fallback for old instaQueueState if crypto_roller_settings doesn't have it
            if (!savedSettingsStr || !JSON.parse(savedSettingsStr).hasOwnProperty('instaQueue')) {
                const savedInstaQueue = localStorage.getItem('instaQueueState');
                if (savedInstaQueue !== null) {
                    isInstaQueue = savedInstaQueue === 'true';
                }
            }

            updateStressUI();
            runCustomStressTest();
            renderDiceGrid();
            updateRulesUI();
        };

    </script>
</body>

</html>
