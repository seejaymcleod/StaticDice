<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Static Dice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap');

        :root {
            --bg-deep: #020617;
            --bg-card: rgba(15, 23, 42, 0.6);
            --accent-sky: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
            --accent-rose: #f43f5e;
            --accent-emerald: #10b981;
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shine: rgba(255, 255, 255, 0.03);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-deep);
            background-image:
                radial-gradient(circle at 0% 0%, rgba(56, 189, 248, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(244, 63, 94, 0.05) 0%, transparent 50%);
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .hide-spinners::-webkit-outer-spin-button,
        .hide-spinners::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .hide-spinners {
            -moz-appearance: textfield;
        }

        .glass-panel {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .segmented-row {
            background: rgba(30, 41, 59, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 0.75rem;
            display: flex;
            align-items: stretch;
            height: 3rem;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .segmented-row:focus-within {
            border-color: var(--accent-sky);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .segmented-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            position: relative;
        }

        .segmented-btn:active:not(:disabled) {
            background: rgba(255, 255, 255, 0.08);
            transform: scale(0.98);
        }

        .segmented-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-side {
            width: 20%;
            flex-shrink: 0;
            font-size: 1.25rem;
            font-weight: 600;
            color: #94a3b8;
        }

        .btn-center {
            flex-grow: 1;
            border-left: 1px solid var(--glass-border);
            border-right: 1px solid var(--glass-border);
            background: rgba(15, 23, 42, 0.2);
            overflow: hidden;
        }

        .btn-center svg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.08;
            width: 2.5rem;
            height: 2.5rem;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .segmented-row:hover .btn-center svg {
            opacity: 0.15;
            transform: translate(-50%, -50%) scale(1.15);
        }

        @keyframes pulse-emerald {
            0% {
                filter: drop-shadow(0 0 0px var(--accent-emerald));
                transform: scale(1);
            }

            50% {
                filter: drop-shadow(0 0 30px var(--accent-emerald));
                transform: scale(1.15);
            }

            100% {
                filter: drop-shadow(0 0 10px var(--accent-emerald));
                transform: scale(1);
            }
        }

        .crit-hit {
            animation: pulse-emerald 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: var(--accent-emerald) !important;
            text-shadow: 0 0 25px var(--accent-emerald);
        }

        .crit-fail {
            color: var(--accent-rose) !important;
            opacity: 0.8;
            transform: scale(0.9) rotate(-3deg);
            text-shadow: 0 0 20px var(--accent-rose);
            transition: all 0.3s ease;
        }

        @keyframes roll-blur {
            0% {
                filter: blur(0) brightness(1);
                transform: translateY(0);
            }

            50% {
                filter: blur(6px) brightness(1.2);
                transform: translateY(-4px);
            }

            100% {
                filter: blur(0) brightness(1);
                transform: translateY(0);
            }
        }

        .is-rolling {
            animation: roll-blur 0.1s infinite;
        }

        .bar {
            background: var(--accent-sky);
            border-radius: 2px;
            transition: height 0.3s ease;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .saved-item {
            background: rgba(30, 41, 59, 0.2);
            border: 1px solid var(--glass-border);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .saved-item:hover {
            background: rgba(51, 65, 85, 0.3);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        #color-picker-overlay {
            background: rgba(2, 6, 23, 0.85);
            backdrop-filter: blur(16px);
            z-index: 100;
        }

        .result-shimmer {
            position: relative;
            overflow: hidden;
        }

        .result-shimmer::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            transform: rotate(45deg);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%) rotate(45deg);
            }

            100% {
                transform: translateX(100%) rotate(45deg);
            }
        }

        .desktop-only {
            display: none;
        }

        @media (min-width: 640px) {
            .mobile-only {
                display: none !important;
            }

            .desktop-only {
                display: block !important;
            }
        }

        /* Mode Toggle Styles */
        .mode-dice .section-dice {
            order: 2;
        }

        .mode-dice .section-arsenal {
            order: 3;
        }

        .mode-arsenal .section-dice {
            order: 3;
        }

        .mode-arsenal .section-arsenal {
            order: 2;
        }

        .section-sticky {
            order: 0;
        }

        .section-controls {
            order: 1;
        }

        .section-bottom {
            order: 10;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 20px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(30, 41, 59, 0.5);
            transition: .4s;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 12px;
            width: 12px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.toggle-slider {
            background-color: var(--accent-sky);
        }

        input:checked+.toggle-slider:before {
            transform: translateX(16px);
        }

        .volume-slider-overlay {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            padding: 8px 16px;
            border-radius: 1rem;
            z-index: 100;
            display: none;
            flex-direction: row;
            align-items: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            width: 180px;
            height: 40px;
        }

        .volume-slider-overlay.show {
            display: flex;
        }

        .horizontal-range {
            flex-grow: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            outline: none;
            appearance: none;
            margin: 0;
            width: 100%;
        }

        .horizontal-range::-webkit-slider-thumb {
            appearance: none;
            width: 14px;
            height: 14px;
            background: var(--accent-sky);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px var(--accent-glow);
        }
    </style>
</head>

<body class="flex flex-col items-center">
    <div id="main-container" class="w-full max-w-md p-4 space-y-3 flex flex-col min-h-screen mode-dice">

        <!-- STICKY TOP -->
        <div
            class="section-sticky sticky top-0 z-40 bg-slate-950/80 backdrop-blur-md -mx-4 px-4 py-3 space-y-4 shadow-xl border-b border-white/5">
            <!-- HEADER -->
            <header class="flex justify-between items-center px-2">
                <div>
                    <h1 class="text-xl font-black text-white tracking-tighter leading-none">STATIC<span
                            class="text-sky-500">DICE</span></h1>
                </div>
                <div class="flex items-center gap-3">
                    <!-- SOUND CONTROL -->
                    <div class="flex items-center relative">
                        <button id="sound-btn" onclick="toggleSound()" onmousedown="handleSoundStart(event)"
                            onmouseup="handleSoundEnd(event)" onmouseleave="handleSoundEnd(event)"
                            ontouchstart="handleSoundStart(event)" ontouchend="handleSoundEnd(event)"
                            class="bg-slate-800/50 text-slate-400 h-8 w-8 flex items-center justify-center rounded-lg border border-white/5 transition-all hover:text-sky-400 active:scale-95">
                            <svg id="sound-icon-on" class="w-4 h-4" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                            </svg>
                            <svg id="sound-icon-off" class="w-4 h-4 hidden" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
                            </svg>
                        </button>
                        <div id="volume-overlay" class="volume-overlay volume-slider-overlay">
                            <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.5"
                                class="horizontal-range" oninput="updateVolume(this.value)">
                        </div>
                    </div>
                </div>
            </header>

            <!-- MAIN DISPLAY -->
            <main
                class="glass-panel p-4 rounded-2xl flex flex-col items-center justify-center min-h-[90px] relative overflow-hidden shrink-0 result-shimmer">
                <div
                    class="absolute inset-0 bg-gradient-to-br from-sky-500/5 via-transparent to-rose-500/5 pointer-events-none">
                </div>
                <div id="final-result"
                    class="final-result-val text-5xl font-black text-white leading-none tabular-nums tracking-tighter transition-all duration-300 drop-shadow-2xl">
                    0</div>
                <div id="detail-text"
                    class="detail-text-val text-[11px] mono text-slate-300 mt-3 text-center px-4 min-h-[20px] flex flex-col items-center justify-center opacity-90 leading-relaxed tracking-wide gap-1">
                    READY</div>
            </main>
        </div>

        <!-- CONTROLS -->
        <section class="section-controls space-y-3">
            <div class="flex gap-2">
                <div
                    class="flex-1 glass-panel px-4 py-2 rounded-xl flex items-center justify-center min-h-[40px] border-white/5 overflow-hidden">
                    <div id="queue-display"
                        class="text-[12px] font-bold text-sky-400 mono text-center leading-relaxed uppercase truncate">
                        Empty Queue</div>
                </div>
                <div class="flex gap-1.5">
                    <button onclick="backspaceQueue()"
                        class="bg-slate-800/50 text-slate-400 px-2.5 py-1.5 rounded-lg border border-white/5 font-black text-[9px] active:bg-sky-500/20 transition-all uppercase hover:text-sky-400">
                        ⌫
                    </button>
                    <button onclick="clearQueue()"
                        class="bg-slate-800/50 text-slate-400 px-2 py-1.5 rounded-lg border border-white/5 font-black text-[9px] active:bg-rose-500/20 transition-all uppercase hover:text-rose-400">
                        Clear
                    </button>
                    <button id="save-queue-btn" onclick="saveCurrentQueue()" disabled
                        class="bg-sky-500/10 text-sky-400/50 px-2.5 py-1.5 rounded-lg border border-sky-500/10 font-black text-[9px] transition-all uppercase disabled:opacity-50">
                        Save
                    </button>
                </div>
            </div>

            <!-- ROLL BUTTON -->
            <button id="roll-button" onclick="resolveRolling()"
                class="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-black py-3 rounded-xl text-xl shadow-[0_0_20px_rgba(56,189,248,0.2)] active:scale-[0.98] transition-all border-b-2 border-sky-700 uppercase tracking-widest mb-2">
                ROLL
            </button>

            <!-- ADV DIS & EXTRA CONTROLS -->
            <div class="grid grid-cols-[1fr_1fr_auto_auto] gap-2 items-center">
                <button id="adv-btn" onclick="applyModifier('ADV')" disabled
                    class="segmented-row justify-center items-center flex-col disabled:opacity-50 transition-all hover:bg-white/5 group !h-[2.5rem]">
                    <span id="adv-label"
                        class="text-[9px] font-black text-slate-500 uppercase tracking-widest group-hover:text-emerald-400 transition-colors">Advantage</span>
                    <span id="adv-sub" class="text-[8px] font-bold text-slate-600 mono leading-none">LOCKED</span>
                </button>
                <button id="dis-btn" onclick="applyModifier('DIS')" disabled
                    class="segmented-row justify-center items-center flex-col disabled:opacity-50 transition-all hover:bg-white/5 group !h-[2.5rem]">
                    <span id="dis-label"
                        class="text-[9px] font-black text-slate-500 uppercase tracking-widest group-hover:text-rose-400 transition-colors">Disadvantage</span>
                    <span id="dis-sub" class="text-[8px] font-bold text-slate-600 mono leading-none">LOCKED</span>
                </button>

                <div class="flex flex-col justify-center items-center !h-[2.5rem] px-1 border-l border-white/5 pl-2">
                    <span
                        class="text-[6px] font-black text-slate-500 uppercase tracking-widest leading-none mb-1 text-center w-full">Roll
                        to<br>Queue</span>
                    <div class="flex items-center mt-[-2px]">
                        <label class="toggle-switch scale-[0.55] origin-center">
                            <input type="checkbox" id="insta-queue-toggle" onchange="saveInstaQueueState(); vibrate(5)">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                </div>

                <button id="adv-rules-toggle" onclick="toggleRulesPanel()"
                    class="w-[2.5rem] h-[2.5rem] rounded-lg bg-slate-800/50 hover:bg-slate-700/50 flex flex-col items-center justify-center text-slate-400 hover:text-sky-400 transition-colors border border-white/5">
                    <svg class="w-4 h-4 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
                        </path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                    <span class="text-[5px] font-black uppercase tracking-widest">Rules</span>
                </button>
            </div>

            <!-- ADVANCED RULES PANEL -->
            <div class="glass-panel rounded-xl overflow-hidden border-white/5 transition-all hidden mt-2"
                id="rules-panel">
                <div class="p-3 space-y-3 bg-slate-900/40">
                    <!-- Reroll -->
                    <div
                        class="flex items-center justify-between gap-2 bg-slate-950/30 p-1.5 rounded-lg border border-white/5">
                        <span
                            class="text-[9px] font-bold text-slate-400 uppercase tracking-widest w-14 text-center">Reroll</span>
                        <div class="flex-1 flex gap-1 items-center justify-end">
                            <select id="rule-reroll-op"
                                class="bg-slate-900 text-sky-400 text-[10px] font-bold rounded p-1 outline-none border border-white/5 text-center"
                                onchange="updateRulesUI()">
                                <option value="">Off</option>
                                <option value="<=">&le;</option>
                                <option value="=">=</option>
                                <option value=">=">&ge;</option>
                            </select>
                            <div id="rule-reroll-input-container"
                                class="flex items-center bg-slate-900 rounded border border-white/5 overflow-hidden transition-all opacity-30 pointer-events-none">
                                <button onclick="adjustRuleVal('reroll', -1)"
                                    class="w-6 h-6 flex items-center justify-center text-slate-400 hover:text-white bg-white/5 active:bg-white/10 transition-colors">-</button>
                                <input type="number" id="rule-reroll-val"
                                    class="w-8 bg-transparent text-sky-400 text-[10px] font-bold text-center outline-none hide-spinners focus:bg-white/5 transition-colors"
                                    placeholder="#" oninput="updateRulesUI(true)">
                                <button onclick="adjustRuleVal('reroll', 1)"
                                    class="w-6 h-6 flex items-center justify-center text-slate-400 hover:text-white bg-white/5 active:bg-white/10 transition-colors">+</button>
                            </div>
                        </div>
                    </div>
                    <!-- Explode -->
                    <div
                        class="flex items-center justify-between gap-2 bg-slate-950/30 p-1.5 rounded-lg border border-white/5">
                        <span
                            class="text-[9px] font-bold text-slate-400 uppercase tracking-widest w-14 text-center">Explode</span>
                        <div class="flex-1 flex gap-1 items-center justify-end">
                            <select id="rule-explode-op"
                                class="bg-slate-900 text-sky-400 text-[10px] font-bold rounded p-1 outline-none border border-white/5 text-center"
                                onchange="updateRulesUI()">
                                <option value="">Off</option>
                                <option value=">=">&ge;</option>
                                <option value="=">=</option>
                                <option value="<=">&le;</option>
                            </select>
                            <div id="rule-explode-input-container"
                                class="flex items-center bg-slate-900 rounded border border-white/5 overflow-hidden transition-all opacity-30 pointer-events-none">
                                <button onclick="adjustRuleVal('explode', -1)"
                                    class="w-6 h-6 flex items-center justify-center text-slate-400 hover:text-white bg-white/5 active:bg-white/10 transition-colors">-</button>
                                <input type="number" id="rule-explode-val"
                                    class="w-8 bg-transparent text-sky-400 text-[10px] font-bold text-center outline-none hide-spinners focus:bg-white/5 transition-colors"
                                    placeholder="#" oninput="updateRulesUI(true)">
                                <button onclick="adjustRuleVal('explode', 1)"
                                    class="w-6 h-6 flex items-center justify-center text-slate-400 hover:text-white bg-white/5 active:bg-white/10 transition-colors">+</button>
                            </div>
                        </div>
                    </div>
                    <!-- Target -> Method -->
                    <div
                        class="flex items-center justify-between gap-1 bg-slate-950/30 p-1.5 rounded-lg border border-white/5">
                        <span
                            class="text-[9px] font-bold text-slate-400 uppercase tracking-widest w-12 text-center pl-1">Method</span>
                        <div class="flex-1 flex gap-1 items-center justify-end">
                            <button id="rule-target-mode" onclick="toggleTargetMode()"
                                class="bg-slate-900 text-emerald-400 text-[9px] font-bold rounded px-1.5 py-1 outline-none border border-emerald-500/20 text-center uppercase w-12 transition-colors hover:bg-emerald-500/10">SUM</button>
                            <select id="rule-target-op"
                                class="bg-slate-900 text-emerald-400 text-[10px] font-bold rounded p-1 outline-none border border-emerald-500/20 text-center"
                                onchange="updateRulesUI()">
                                <option value="">All</option>
                                <option value=">=">&ge;</option>
                                <option value="=">=</option>
                                <option value="<=">&le;</option>
                            </select>
                            <div id="rule-target-input-container"
                                class="flex items-center bg-slate-900 rounded border border-emerald-500/20 overflow-hidden transition-all opacity-30 pointer-events-none">
                                <button onclick="adjustRuleVal('target', -1)"
                                    class="w-5 h-6 flex items-center justify-center text-slate-400 hover:text-white bg-white/5 active:bg-white/10 transition-colors">-</button>
                                <input type="number" id="rule-target-val"
                                    class="w-6 bg-transparent text-emerald-400 text-[10px] font-bold text-center outline-none hide-spinners focus:bg-white/5 transition-colors"
                                    placeholder="#" oninput="updateRulesUI(true)">
                                <button onclick="adjustRuleVal('target', 1)"
                                    class="w-5 h-6 flex items-center justify-center text-slate-400 hover:text-white bg-white/5 active:bg-white/10 transition-colors">+</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section id="dice-section" class="section-dice space-y-3">
            <div class="grid grid-cols-2 gap-3">
                <script>
                    const diceSet = [
                        { d: 4, path: "M12 2L2 20h20L12 2z" },
                        { d: 6, path: "M4 4h16v16H4z" },
                        { d: 8, path: "M12 2l10 10-10 10-10-10L12 2z" },
                        { d: 10, path: "M12 2l8 6-2 12-6 2-6-2-2-12 8-6z" },
                        { d: 12, path: "M12 2l7 4v8l-7 4-7-4V6l7-4z" },
                        { d: 20, path: "M12 2l9 5v10l-9 5-9-5V7l9-5z M12 2v20" },
                        { d: 100, path: "M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z" }
                    ];

                    diceSet.forEach(cfg => {
                        document.write(`
                            <div class="segmented-row">
                                <button onclick="changeQueue(${cfg.d}, -1)" class="segmented-btn btn-side">－</button>
                                <button onclick="instantRoll(${cfg.d})" class="segmented-btn btn-center group/dice">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                        <path d="${cfg.path}" />
                                    </svg>
                                    <span class="font-black text-base text-white z-10 mono">D${cfg.d}</span>
                                </button>
                                <button onclick="changeQueue(${cfg.d}, 1)" class="segmented-btn btn-side">＋</button>
                            </div>
                        `);
                    });

                    document.write(`
                        <div class="segmented-row">
                            <button onclick="adjustFlatMod(-1)" class="segmented-btn btn-side">－</button>
                            <div class="segmented-btn btn-center cursor-default flex flex-col justify-center">
                                <span class="text-[8px] font-black text-sky-400/40 uppercase tracking-[0.2em] mb-0.5">Modifier</span>
                                <span id="mod-val-display" class="font-black text-xl text-sky-400 mono leading-none">0</span>
                            </div>
                            <button onclick="adjustFlatMod(1)" class="segmented-btn btn-side">＋</button>
                        </div>
                    `);
                </script>
            </div>
        </section>

        <!-- ARSENAL VIEW -->
        <section id="arsenal-section" class="section-arsenal space-y-3">
            <div class="flex justify-between items-center px-2">
                <h3 class="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em]">Dice Arsenal</h3>
                <div class="flex gap-2">
                    <button onclick="toggleMode()"
                        class="bg-sky-500/10 text-sky-400 px-2 py-0.5 rounded-lg text-[9px] font-bold border border-sky-500/20 uppercase transition-all flex items-center gap-1 hover:bg-sky-500/20">
                        <span id="mode-label">Arsenal</span>
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"></path>
                        </svg>
                    </button>
                    <button onclick="exportSettings()"
                        class="text-[9px] font-bold text-sky-400/60 hover:text-sky-400 bg-sky-400/5 px-2 py-0.5 rounded-lg border border-sky-400/10 transition-all uppercase">Export</button>
                    <button onclick="document.getElementById('import-input').click()"
                        class="text-[9px] font-bold text-emerald-400/60 hover:text-emerald-400 bg-emerald-400/5 px-2 py-0.5 rounded-lg border border-emerald-400/10 transition-all uppercase">Import</button>
                </div>
            </div>
            <div class="saved-queues-list grid grid-cols-1 gap-3">
                <!-- Items injected here -->
            </div>
        </section>

        <input type="file" id="import-input" class="hidden" accept=".json" onchange="importSettings(event)">

        <section id="bottom-section" class="section-bottom flex-grow space-y-3 pb-4">
            <div class="glass-panel rounded-xl p-3 flex flex-col space-y-2 border-white/5">
                <div class="flex justify-between items-center">
                    <h3 class="text-[9px] font-black text-slate-500 uppercase tracking-widest">History</h3>
                    <button onclick="clearHistory()"
                        class="text-[9px] font-black text-slate-600 hover:text-rose-400 transition-colors uppercase">Wipe</button>
                </div>
                <div id="history-log" class="custom-scroll max-h-24 overflow-y-auto space-y-1.5 pr-1">
                    <p class="text-[9px] text-slate-600 italic px-1">Log is empty...</p>
                </div>
            </div>

            <details class="group">
                <summary
                    class="list-none cursor-pointer flex items-center justify-between glass-panel p-4 rounded-2xl border-white/5">
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Entropy Verification
                    </h3>
                    <svg class="w-4 h-4 text-slate-500 transition-transform group-open:rotate-180" fill="none"
                        stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                </summary>
                <div class="p-4 space-y-3 bg-black/20 rounded-b-2xl border-x border-b border-white/5">
                    <div class="flex items-center justify-between">
                        <span class="text-[10px] text-slate-500 mono">D20 Distribution (N=1000)</span>
                        <div class="flex items-center gap-2">
                            <input type="number" id="stress-count" value="1000"
                                class="w-14 bg-slate-900 border border-white/5 rounded-lg text-[10px] font-black text-sky-400 px-2 py-1 focus:outline-none focus:border-sky-500/50">
                            <button onclick="runCustomStressTest()"
                                class="bg-sky-500/10 text-sky-400 px-3 py-1 rounded-lg text-[10px] font-black hover:bg-sky-500 hover:text-slate-950 transition-all uppercase">Verify</button>
                        </div>
                    </div>
                    <div id="chart-area"
                        class="h-12 flex items-end justify-between gap-0.5 border-b border-white/5 pb-1"></div>
                </div>
            </details>
        </section>
    </div>

    <!-- Color Picker Modal -->
    <div id="color-picker-overlay" class="fixed inset-0 hidden items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-[2rem] shadow-2xl w-full max-w-[280px] space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Select Color</h3>
                <button onclick="closeColorPicker()" class="text-slate-500 hover:text-white transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                        </path>
                    </svg>
                </button>
            </div>
            <div id="color-grid" class="grid grid-cols-4 gap-3">
                <!-- Colors injected here -->
            </div>
        </div>
    </div>

    <script src="DiceEngine.js"></script>
    <script>
        const engine = new DiceEngine();
        let pickerTargetId = null;
        let soundEnabled = true;
        let volume = 0.5;
        let soundTimer = null;
        let isVolumeOpen = false;
        let isDraggingVolume = false;
        const rollSound = new Audio('Assets/353844__magnesus__dice8.flac');
        rollSound.volume = volume;

        const COLOR_PALETTE = [
            '#ef4444', '#f97316', '#eab308', '#84cc16', '#22c55e', '#10b981',
            '#06b6d4', '#38bdf8', '#3b82f6', '#6366f1', '#8b5cf6', '#ec4899'
        ];

        function toggleTargetMode() {
            const btn = document.getElementById('rule-target-mode');
            btn.innerText = btn.innerText === 'SUM' ? 'COUNT' : 'SUM';
            updateRulesUI();
        }

        function toggleRulesPanel() {
            const panel = document.getElementById('rules-panel');
            const btn = document.getElementById('adv-rules-toggle');
            if (panel.classList.contains('hidden')) {
                panel.classList.remove('hidden');
                btn.classList.add('bg-sky-500/20', 'text-sky-400', 'border-sky-500/30');
                btn.classList.remove('bg-slate-800/50', 'text-slate-400', 'border-white/5');
            } else {
                panel.classList.add('hidden');
                btn.classList.remove('bg-sky-500/20', 'text-sky-400', 'border-sky-500/30');
                btn.classList.add('bg-slate-800/50', 'text-slate-400', 'border-white/5');
            }
        }

        function saveInstaQueueState() {
            saveSettings();
        }

        function adjustRuleVal(type, delta) {
            const opSelect = document.getElementById(`rule-${type}-op`);
            if (!opSelect.value) return;

            const input = document.getElementById(`rule-${type}-val`);
            let val = parseInt(input.value) || (type === 'target' ? 5 : 1);
            val += delta;
            if (val < 1) val = 1;
            input.value = val;
            updateRulesUI();
        }

        function updateRulesUI(fromInput = false) {
            ['reroll', 'explode', 'target'].forEach(type => {
                const op = document.getElementById(`rule-${type}-op`).value;
                const container = document.getElementById(`rule-${type}-input-container`);
                const input = document.getElementById(`rule-${type}-val`);

                if (op) {
                    container.classList.remove('opacity-30', 'pointer-events-none');
                    if (!fromInput && !input.value) input.value = type === 'target' ? '5' : '1';
                } else {
                    container.classList.add('opacity-30', 'pointer-events-none');
                    if (!fromInput) input.value = '';
                }
            });

            engine.updateRules({
                rerollOp: document.getElementById('rule-reroll-op').value,
                rerollVal: parseInt(document.getElementById('rule-reroll-val').value) || null,
                explodeOp: document.getElementById('rule-explode-op').value,
                explodeVal: parseInt(document.getElementById('rule-explode-val').value) || null,
                targetMode: document.getElementById('rule-target-mode').innerText.toLowerCase(),
                targetOp: document.getElementById('rule-target-op').value,
                targetVal: parseInt(document.getElementById('rule-target-val').value) || null
            });
            updateUI();
        }

        function toggleSound() {
            if (isVolumeOpen) return;
            soundEnabled = !soundEnabled;
            updateSoundUI();
            saveSettings();
            vibrate(5);
        }

        function updateSoundUI() {
            const iconOn = document.getElementById('sound-icon-on');
            const iconOff = document.getElementById('sound-icon-off');
            const btn = document.getElementById('sound-btn');

            if (soundEnabled) {
                iconOn.classList.remove('hidden');
                iconOff.classList.add('hidden');
                btn.classList.add('text-slate-400');
                btn.classList.remove('text-slate-600');
            } else {
                iconOn.classList.add('hidden');
                iconOff.classList.remove('hidden');
                btn.classList.add('text-slate-600');
                btn.classList.remove('text-slate-400');
            }
        }

        function handleSoundStart(e) {
            soundTimer = setTimeout(() => {
                isVolumeOpen = true;
                isDraggingVolume = true;
                showVolumeSlider();

                window.addEventListener('mousemove', handleGlobalDrag);
                window.addEventListener('touchmove', handleGlobalDrag, { passive: false });
                window.addEventListener('mouseup', handleGlobalUp);
                window.addEventListener('touchend', handleGlobalUp);
            }, 500);
        }

        function handleSoundEnd(e) {
            clearTimeout(soundTimer);
        }

        function handleGlobalDrag(e) {
            if (!isDraggingVolume) return;
            e.preventDefault();

            const slider = document.getElementById('volume-slider');
            const rect = slider.getBoundingClientRect();
            const clientX = e.type.startsWith('touch') ? e.touches[0].clientX : e.clientX;

            let percentage = (clientX - rect.left) / rect.width;
            percentage = Math.max(0, Math.min(1, percentage));

            slider.value = percentage;
            updateVolume(percentage);
        }

        function handleGlobalUp() {
            isDraggingVolume = false;
            window.removeEventListener('mousemove', handleGlobalDrag);
            window.removeEventListener('touchmove', handleGlobalDrag);
            window.removeEventListener('mouseup', handleGlobalUp);
            window.removeEventListener('touchend', handleGlobalUp);
        }

        function showVolumeSlider() {
            const overlay = document.getElementById('volume-overlay');
            overlay.classList.add('show');
            vibrate(15);

            const closeHandler = (e) => {
                if (!overlay.contains(e.target) && !document.getElementById('sound-btn').contains(e.target)) {
                    overlay.classList.remove('show');
                    document.removeEventListener('mousedown', closeHandler);
                    setTimeout(() => isVolumeOpen = false, 100);
                }
            };
            setTimeout(() => document.addEventListener('mousedown', closeHandler), 10);
        }

        function updateVolume(val) {
            volume = parseFloat(val);
            rollSound.volume = volume;
            if (volume > 0 && !soundEnabled) {
                soundEnabled = true;
                updateSoundUI();
            }
            saveSettings();
        }

        function playRollSound() {
            if (!soundEnabled) return;
            rollSound.currentTime = 0;
            rollSound.play().catch(e => console.log("Sound play blocked"));
        }

        function toggleMode() {
            const container = document.getElementById('main-container');
            const label = document.getElementById('mode-label');
            if (container.classList.contains('mode-dice')) {
                container.classList.remove('mode-dice');
                container.classList.add('mode-arsenal');
                label.innerText = 'Dice';
            } else {
                container.classList.remove('mode-arsenal');
                container.classList.add('mode-dice');
                label.innerText = 'Arsenal';
            }
            vibrate(10);
        }

        function vibrate(ms = 10) {
            if (navigator.vibrate) navigator.vibrate(ms);
        }

        function changeQueue(sides, delta) {
            vibrate(5);
            engine.changeQueue(sides, delta);
            updateUI();
        }

        function backspaceQueue() {
            vibrate(10);
            engine.backspaceQueue();
            updateUI();
        }

        function adjustFlatMod(val) {
            engine.adjustFlatMod(val);
            updateUI();
        }

        function applyModifier(type) {
            vibrate(10);
            engine.applyModifier(type);
            updateUI();
        }

        function clearQueue() {
            engine.clearQueue();

            document.getElementById('rule-reroll-op').value = "";
            document.getElementById('rule-explode-op').value = "";
            document.getElementById('rule-target-op').value = "";
            updateRulesUI();

            updateDisplay("0", "READY");
            updateUI();
        }

        function updateDisplay(val, detail, classAction = null) {
            const results = document.querySelectorAll('.final-result-val');
            const details = document.querySelectorAll('.detail-text-val');

            results.forEach(el => {
                el.innerText = val;
                if (classAction === 'rolling') el.classList.add('is-rolling');
                else if (classAction === 'stop') el.classList.remove('is-rolling');
                else if (classAction) {
                    el.className = el.className.split(' ').filter(c => !c.startsWith('crit-')).join(' ');
                    el.classList.add(classAction);
                } else {
                    el.className = el.className.split(' ').filter(c => !c.startsWith('crit-')).join(' ');
                }
            });
            details.forEach(el => el.innerHTML = detail);
        }

        function updateUI() {
            const display = document.getElementById('queue-display');
            const advBtn = document.getElementById('adv-btn');
            const disBtn = document.getElementById('dis-btn');
            const advSub = document.getElementById('adv-sub');
            const disSub = document.getElementById('dis-sub');
            const modDisplay = document.getElementById('mod-val-display');
            const saveBtn = document.getElementById('save-queue-btn');

            let parts = engine.rollingQueue.map(q => `${q.count}d${q.sides}`);
            if (engine.flatMod !== 0) parts.push(`[${engine.flatMod > 0 ? '+' : ''}${engine.flatMod}]`);

            let modifierText = engine.activeModifier ? ` [${engine.activeModifier}${engine.modifierLevel > 1 ? '+' + (engine.modifierLevel - 1) : ''}]` : "";

            let rulesText = "";
            if (engine.rollRules.rerollOp && engine.rollRules.rerollVal !== null) rulesText += ` RR${engine.rollRules.rerollOp}${engine.rollRules.rerollVal}`;
            if (engine.rollRules.explodeOp && engine.rollRules.explodeVal !== null) rulesText += ` EX${engine.rollRules.explodeOp}${engine.rollRules.explodeVal}`;
            if (engine.rollRules.targetMode === 'count') {
                rulesText += ` CT`;
                if (engine.rollRules.targetOp && engine.rollRules.targetVal !== null) rulesText += `${engine.rollRules.targetOp}${engine.rollRules.targetVal}`;
            } else {
                if (engine.rollRules.targetOp && engine.rollRules.targetVal !== null) rulesText += ` SUM${engine.rollRules.targetOp}${engine.rollRules.targetVal}`;
            }

            display.innerText = (parts.length > 0 || modifierText || rulesText) ? parts.join(" + ") + modifierText + rulesText : "EMPTY QUEUE";

            modDisplay.innerText = engine.flatMod;

            const hasDice = engine.rollingQueue.length > 0;
            advBtn.disabled = !hasDice;
            disBtn.disabled = !hasDice;

            advBtn.style.borderColor = engine.activeModifier === 'ADV' ? 'var(--accent-emerald)' : '';
            disBtn.style.borderColor = engine.activeModifier === 'DIS' ? 'var(--accent-rose)' : '';

            advSub.innerText = !hasDice ? 'LOCKED' : (engine.activeModifier === 'ADV' ? (engine.modifierLevel > 1 ? `PLUS ${engine.modifierLevel - 1}` : 'ACTIVE') : 'NEUTRAL');
            disSub.innerText = !hasDice ? 'LOCKED' : (engine.activeModifier === 'DIS' ? (engine.modifierLevel > 1 ? `PLUS ${engine.modifierLevel - 1}` : 'ACTIVE') : 'NEUTRAL');

            saveBtn.disabled = !hasDice && engine.flatMod === 0;
        }

        function saveCurrentQueue() {
            const name = prompt("Name this configuration:", `Loadout ${engine.savedQueues.length + 1}`);
            if (!name) return;
            const newSaved = engine.saveQueue(name, COLOR_PALETTE[0]);
            if (newSaved) {
                persistSaved();
                renderSavedQueues();
            }
        }

        function loadQueue(id) {
            engine.loadQueue(id);
            document.getElementById('rule-reroll-op').value = engine.rollRules.rerollOp;
            document.getElementById('rule-reroll-val').value = engine.rollRules.rerollVal;
            document.getElementById('rule-explode-op').value = engine.rollRules.explodeOp;
            document.getElementById('rule-explode-val').value = engine.rollRules.explodeVal;
            document.getElementById('rule-target-mode').innerText = engine.rollRules.targetMode.toUpperCase();
            document.getElementById('rule-target-op').value = engine.rollRules.targetOp;
            document.getElementById('rule-target-val').value = engine.rollRules.targetVal;
            updateUI();
        }

        function deleteQueue(id, event) {
            event.stopPropagation();
            if (!confirm("Delete this saved configuration?")) return;
            engine.deleteQueue(id);
            persistSaved();
            renderSavedQueues();
        }

        function renameQueue(id, event) {
            event.stopPropagation();
            const item = engine.savedQueues.find(q => q.id === id);
            if (!item) return;
            const newName = prompt("Rename configuration:", item.name);
            if (newName) {
                engine.renameQueue(id, newName);
                persistSaved();
                renderSavedQueues();
            }
        }

        function openColorPicker(id, event) {
            event.stopPropagation();
            pickerTargetId = id;
            const overlay = document.getElementById('color-picker-overlay');
            const grid = document.getElementById('color-grid');

            grid.innerHTML = '';
            COLOR_PALETTE.forEach(color => {
                const btn = document.createElement('button');
                btn.className = 'color-option w-10 h-10 rounded-full border-2 border-white/5';
                btn.style.backgroundColor = color;
                btn.style.color = color;
                btn.onclick = () => selectColor(color);
                grid.appendChild(btn);
            });

            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
        }

        function closeColorPicker() {
            const overlay = document.getElementById('color-picker-overlay');
            overlay.classList.add('hidden');
            overlay.classList.remove('flex');
            pickerTargetId = null;
        }

        function selectColor(color) {
            if (pickerTargetId === null) return;
            engine.changeQueueColor(pickerTargetId, color);
            persistSaved();
            renderSavedQueues();
            closeColorPicker();
        }

        function updateSavedQueue(id, event) {
            event.stopPropagation();
            const item = engine.savedQueues.find(q => q.id === id);
            if (!item) return;
            if (!confirm(`Overwrite "${item.name}" with the current active queue?`)) return;

            engine.updateSavedQueue(id);
            persistSaved();
            renderSavedQueues();
        }

        function persistSaved() {
            localStorage.setItem('crypto_roller_saved', JSON.stringify(engine.savedQueues));
        }

        function saveSettings() {
            localStorage.setItem('crypto_roller_settings', JSON.stringify({
                soundEnabled: soundEnabled,
                volume: volume,
                instaQueue: document.getElementById('insta-queue-toggle').checked
            }));
        }

        function exportSettings() {
            const exportData = {
                queues: engine.savedQueues,
                settings: {
                    soundEnabled: soundEnabled,
                    volume: volume,
                    instaQueue: document.getElementById('insta-queue-toggle').checked
                }
            };
            
            const dataStr = JSON.stringify(exportData, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);

            const link = document.createElement('a');
            link.href = url;
            link.download = `StaticDice_backup_${new Date().toISOString().slice(0, 10)}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        function importSettings(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    let importedQueues = [];
                    let importedSettings = null;

                    if (Array.isArray(imported)) {
                        importedQueues = imported;
                    } else if (imported && typeof imported === 'object') {
                        importedQueues = imported.queues || [];
                        importedSettings = imported.settings;
                    } else {
                        throw new Error("Invalid format");
                    }

                    const mode = confirm("Import successful! \n\nClick OK to MERGE queues (settings will be overwritten). \nClick CANCEL to OVERWRITE everything.") ? 'merge' : 'overwrite';

                    if (mode === 'merge') {
                        const currentIds = new Set(engine.savedQueues.map(q => q.id));
                        importedQueues.forEach(item => {
                            if (!currentIds.has(item.id)) {
                                engine.savedQueues.push(item);
                            } else {
                                item.id = Date.now() + Math.random();
                                engine.savedQueues.push(item);
                            }
                        });
                    } else {
                        engine.setSavedQueues(importedQueues);
                    }

                    if (importedSettings) {
                        if (importedSettings.soundEnabled !== undefined) {
                            soundEnabled = importedSettings.soundEnabled;
                        }
                        if (importedSettings.volume !== undefined) {
                            volume = importedSettings.volume;
                            rollSound.volume = volume;
                            document.getElementById('volume-slider').value = volume;
                        }
                        if (importedSettings.instaQueue !== undefined) {
                            document.getElementById('insta-queue-toggle').checked = importedSettings.instaQueue;
                            saveInstaQueueState();
                        }
                        saveSettings();
                        updateSoundUI();
                    }

                    persistSaved();
                    renderSavedQueues();
                    alert(`Successfully imported backup!`);
                } catch (err) {
                    alert("Error importing file. Please ensure it's a valid Arsenal JSON backup.");
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        function renderSavedQueues() {
            const lists = document.querySelectorAll('.saved-queues-list');
            const countDisplays = document.querySelectorAll('.saved-count');

            const countText = `${engine.savedQueues.length}/20`;
            countDisplays.forEach(el => el.innerText = countText);

            lists.forEach(list => {
                list.innerHTML = '';

                if (engine.savedQueues.length === 0) {
                    list.innerHTML = '<div class="text-[10px] text-slate-600 italic px-1 py-8 text-center border-2 border-dashed border-white/5 rounded-[1.5rem] bg-white/[0.02] col-span-full">No saved loadouts yet.</div>';
                    return;
                }

                engine.savedQueues.forEach(q => {
                    const item = document.createElement('div');
                    item.className = 'saved-item p-3 rounded-xl flex items-center gap-3 cursor-pointer group relative overflow-hidden';
                    item.onclick = () => { loadQueue(q.id); resolveRolling(); };

                    let formula = q.queue.map(dq => `${dq.count}d${dq.sides}`).join("+");
                    if (q.flat !== 0) formula += ` [${q.flat > 0 ? '+' : ''}${q.flat}]`;
                    if (q.modifier) formula += ` [${q.modifier}${q.modLevel > 1 ? '+' + (q.modLevel - 1) : ''}]`;

                    if (q.rules) {
                        if (q.rules.rerollOp && q.rules.rerollVal !== null) formula += ` RR${q.rules.rerollOp}${q.rules.rerollVal}`;
                        if (q.rules.explodeOp && q.rules.explodeVal !== null) formula += ` EX${q.rules.explodeOp}${q.rules.explodeVal}`;
                        if (q.rules.targetOp && q.rules.targetVal !== null) formula += ` TGT${q.rules.targetOp}${q.rules.targetVal}`;
                    }

                    item.innerHTML = `
                        <div class="w-1 h-6 rounded-full shadow-[0_0_8px_currentColor]" style="background-color: ${q.color}; color: ${q.color}"></div>
                        <div class="flex-grow min-w-0">
                            <div class="text-[11px] font-black text-white truncate uppercase tracking-tight">${q.name}</div>
                            <div class="text-[9px] mono text-slate-500 truncate mt-0.5">${formula || 'Empty'}</div>
                        </div>
                        <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-all">
                            <button onclick="updateSavedQueue(${q.id}, event)" class="w-6 h-6 flex items-center justify-center hover:bg-sky-500/20 rounded-lg text-[9px] text-sky-400" title="Update">💾</button>
                            <button onclick="openColorPicker(${q.id}, event)" class="w-6 h-6 flex items-center justify-center hover:bg-white/10 rounded-lg text-[9px] text-slate-400">🎨</button>
                            <button onclick="deleteQueue(${q.id}, event)" class="w-6 h-6 flex items-center justify-center hover:bg-rose-500/20 rounded-lg text-[9px] text-rose-400">✕</button>
                        </div>
                    `;
                    list.appendChild(item);
                });
            });
        }

        function instantRoll(sides) {
            vibrate(10);

            const affectsQueue = document.getElementById('insta-queue-toggle').checked;

            if (affectsQueue) {
                engine.changeQueue(sides, 1);
                updateUI();
                resolveRolling();
            } else {
                resolveRolling([{ sides: sides, count: 1 }], true);
            }
        }

        let rollGeneration = 0;

        function resolveRolling(forcedQueue = null, isInstant = false) {
            if (!forcedQueue && engine.rollingQueue.length === 0 && engine.flatMod === 0) return;

            // Increment generation to cancel any in-progress animation
            const thisGen = ++rollGeneration;

            vibrate(15);
            playRollSound();

            // Compute result immediately (synchronous)
            const res = engine.calculateRoll(forcedQueue, isInstant);
            if (!res) return;

            // Log to history immediately
            let historyText = res.details.replace(/<[^>]*>?/gm, ' ');
            if (res.targetMode === 'count') historyText = `${res.total} SUCCESSES [ ${historyText} ]`;
            addToHistory(res.total, historyText);

            // Start cosmetic animation, then reveal result
            updateDisplay("...", "ROLLING", "rolling");

            let frame = 0;
            const totalFrames = 8;
            const frameDelay = 40;

            function animateFrame() {
                // If a newer roll has started, stop this animation
                if (rollGeneration !== thisGen) return;

                if (frame < totalFrames) {
                    updateDisplay(Math.floor(Math.random() * 20) + 1, "ROLLING");
                    frame++;
                    setTimeout(animateFrame, frameDelay);
                } else {
                    // Animation done — show the real result
                    showResult(res);
                }
            }

            setTimeout(animateFrame, frameDelay);
        }

        function showResult(res) {
            if (res.targetMode === 'count') {
                updateDisplay(res.total, res.details, "stop");
                if (res.total > 0) {
                    vibrate([40, 80, 40]);
                    document.getElementById('final-result').innerHTML = `<span class="text-4xl block mb-1">${res.total}</span><span class="text-xl tracking-widest text-emerald-400">SUCCESSES</span>`;
                } else {
                    vibrate(60);
                    document.getElementById('final-result').innerHTML = `<span class="text-4xl block mb-1">0</span><span class="text-xl tracking-widest text-rose-400">SUCCESSES</span>`;
                }
            } else {
                updateDisplay(res.total, res.details, "stop");
                if (res.hasCritHit) {
                    updateDisplay(res.total, res.details, "crit-hit");
                    vibrate([40, 80, 40]);
                } else if (res.hasCritFail) {
                    updateDisplay(res.total, res.details, "crit-fail");
                    vibrate(60);
                } else {
                    vibrate(25);
                }
            }
        }

        function addToHistory(val, desc) {
            const log = document.getElementById('history-log');
            if (log.innerHTML.includes('No history')) log.innerHTML = '';
            const item = document.createElement('div');
            item.className = 'history-item flex items-center justify-between bg-slate-800/10 p-1.5 rounded-lg border border-slate-800/40';
            item.innerHTML = `<span class="text-[8px] text-slate-500 mono truncate">${desc}</span><span class="font-black text-sky-400 mono text-[10px]">${val}</span>`;
            log.prepend(item);
            if (log.children.length > 20) log.removeChild(log.lastChild);
        }

        function clearHistory() {
            document.getElementById('history-log').innerHTML = '<p class="text-[9px] text-slate-700 italic px-1">No history yet...</p>';
        }

        function runCustomStressTest() {
            const iterations = parseInt(document.getElementById('stress-count').value) || 1000;
            const sides = 20;
            const tallies = new Array(sides).fill(0);
            const chartArea = document.getElementById('chart-area');
            chartArea.innerHTML = '';
            for (let i = 0; i < iterations; i++) tallies[engine.rng(sides) - 1]++;
            const max = Math.max(...tallies);
            tallies.forEach((t, i) => {
                const bar = document.createElement('div');
                bar.className = 'bar flex-1';
                bar.style.height = `${(t / max) * 100}%`;
                chartArea.appendChild(bar);
            });
        }

        window.onload = () => {
            const stored = localStorage.getItem('crypto_roller_saved');
            if (stored) {
                engine.setSavedQueues(JSON.parse(stored));
                renderSavedQueues();
            }

            const savedSettingsStr = localStorage.getItem('crypto_roller_settings');
            if (savedSettingsStr) {
                try {
                    const savedSettings = JSON.parse(savedSettingsStr);
                    if (savedSettings.soundEnabled !== undefined) soundEnabled = savedSettings.soundEnabled;
                    if (savedSettings.volume !== undefined) {
                        volume = savedSettings.volume;
                        rollSound.volume = volume;
                        document.getElementById('volume-slider').value = volume;
                    }
                    if (savedSettings.instaQueue !== undefined) {
                        document.getElementById('insta-queue-toggle').checked = savedSettings.instaQueue;
                    }
                    updateSoundUI();
                } catch (e) {}
            }

            // Fallback for old instaQueueState if crypto_roller_settings doesn't have it
            if (!savedSettingsStr || !JSON.parse(savedSettingsStr).hasOwnProperty('instaQueue')) {
                const savedInstaQueue = localStorage.getItem('instaQueueState');
                if (savedInstaQueue !== null) {
                    document.getElementById('insta-queue-toggle').checked = savedInstaQueue === 'true';
                }
            }

            runCustomStressTest();
        };

    </script>
</body>
