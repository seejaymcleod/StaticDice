<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: sans-serif; margin: 0; padding: 1rem; }
  .header { height: 3rem; background: #ddd; margin-bottom: 1rem; }
  .sticky-panel { position: sticky; top: 0; background: #faa; padding: 1rem; margin-bottom: 1rem; }
  .sticky-panel-2 { position: sticky; top: 5rem; background: #afa; padding: 1rem; margin-bottom: 1rem; }
  .content { height: 2000px; background: #eee; }
</style>
</head>
<body>
  <div class="header">Site Title (Scrolls away)</div>
  <div class="sticky-panel">Sticky Panel (top: 0) - Moves up then sticks</div>
  <div class="sticky-panel-2">Sticky Panel (top: 5rem) - Never moves up</div>
  <div class="content">Content</div>
</body>
</html>
